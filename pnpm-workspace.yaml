packages:
  - .

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  esbuild@<=0.24.2: ">=0.25.0"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2"
  fast-uri@>=3.0.0 <3.1.7: ">=3.1.7"
  # DoS via uncontrolled recursion in brace-expansion's pattern parser (GHSA-vf4m-9c6m-xr37
  # and GHSA-6j4f-fj2g-mc7p). Reached only through eslint / eslint-config-next, so these are
  # build-time lint deps and not shipped — but CI fails on `pnpm audit --audit-level=high`, so
  # they have to move anyway.
  #
  # The target is an EXACT version, not a range. 3a2cb2d used range targets
  # (`undici@>=8.0.0 <8.10.2: ">=8.10.2"`) and they did not take effect — that commit fixed
  # CI's install failure but left the audit red, because a range target is ambiguous about which
  # version to actually resolve to. Those undici lines have since been removed: with shadcn at
  # 4.21.1 the tree resolves undici 7.30.0 and 8.11.2 on its own, both past their patched
  # versions, so they were dead config that only looked load-bearing. Left in place they would
  # invite the next reader to trust an override that does nothing.
  brace-expansion@<1.1.21: "1.1.21"
  brace-expansion@>=4.0.0 <5.0.12: "5.0.12"
