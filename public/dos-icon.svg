<!-- DOS Site — MSSN Board of Studies · Khatam-book mark
     Primary #0A5ADB (hsl 217 91% 45) / Accent #FA811E (27 96% 55)
     ViewBox 64 — optimised for 16→512px rasterisation -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">DOS Site — MSSN Board of Studies</title>
  <!-- Khatam (8-point star) — two overlapping squares, solid primary -->
  <g id="khatam">
    <rect x="14" y="14" width="36" height="36" rx="3.5" fill="#0A5ADB"/>
    <rect x="14" y="14" width="36" height="36" rx="3.5" fill="#0A5ADB" transform="rotate(45 32 32)"/>
  </g>
  <!-- Accent diamond at north point — aspiration / illumination -->
  <rect x="30.1" y="5.2" width="3.8" height="3.8" rx="0.7" fill="#FA811E" transform="rotate(45 32 7.1)"/>

  <!-- Open book — negative space (white) knocking out of khatam -->
  <!-- left page -->
  <path d="M 18.2 28.2 C 21.6 26.6 27.2 26.9 31.6 29 L 31.6 42.6 C 27.2 40.5 21.6 40.2 18.2 41.8 Z" fill="white" stroke="white" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M 45.8 28.2 C 42.4 26.6 36.8 26.9 32.4 29 L 32.4 42.6 C 36.8 40.5 42.4 40.2 45.8 41.8 Z" fill="white" stroke="white" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- spine highlight -->
  <rect x="31.6" y="29" width="0.8" height="13.6" rx="0.4" fill="#0A5ADB" opacity="0.95"/>
  <!-- text lines — subtle, hint of content (tinted) -->
  <g opacity="0.92">
    <rect x="20.2" y="32.8" width="8.2" height="1.05" rx="0.52" fill="#0A5ADB" opacity="0.14"/>
    <rect x="20.2" y="35.1" width="7.0" height="1.05" rx="0.52" fill="#0A5ADB" opacity="0.10"/>
    <rect x="35.6" y="32.8" width="8.2" height="1.05" rx="0.52" fill="#0A5ADB" opacity="0.14"/>
    <rect x="36.8" y="35.1" width="7.0" height="1.05" rx="0.52" fill="#0A5ADB" opacity="0.10"/>
  </g>
</svg>
